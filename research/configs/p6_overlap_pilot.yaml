experiment_id: p6_adaptive_overlap_pilot
status: PILOT / DEV
description: >
  Phase 6 pilot (dev split only). Adaptive overlap mechanisms O-ext and
  O-bridge, evaluated separately, against uniform and the frozen P5
  information-gain allocation, at equal total shots and at equal U-query
  cost, with rescue diagnostics classifying P5-policy failures as
  shot-fixable / overlap-fixable / both / neither. Targets ambiguity-heavy
  phases (S2 boundary, S1 final-half) plus a uniform stratum.
master_seed: 20260927
split: dev
strata: [S2_boundary, S1_final_half, S4_uniform]
partitions: [[4, 4], [3, 2, 3], [2, 2, 2, 2], [4, 4, 4], [3, 3, 3, 3]]
phases_per_stratum: 8
replicates: 4
S0: [2, 4]
budget_multipliers: [2]
dS: ["S0"]
likelihood_refine: {"8": 3, "12": 3}
stream_multiplier: 6
phase_chunk: 12
rescue_oracle_decoders: [awqpe, awqpe_ext, awqpe_eps_safe_ext, likelihood]
variants:
  - {label: ext_v1_eig_A1, mechanism: ext, v: 1, A_max: 1, trigger: eig}
  - {label: ext_v1_eig_A2, mechanism: ext, v: 1, A_max: 2, trigger: eig}
  - {label: ext_v1_lowerhalf_A1, mechanism: ext, v: 1, A_max: 1, trigger: lowerhalf}
  - {label: ext_v1_lowerhalf_A2, mechanism: ext, v: 1, A_max: 2, trigger: lowerhalf}
  - {label: ext_v2_eig_A1, mechanism: ext, v: 2, A_max: 1, trigger: eig}
  - {label: ext_v2_lowerhalf_A1, mechanism: ext, v: 2, A_max: 1, trigger: lowerhalf}
  - {label: bridge_half_eig_A1, mechanism: bridge, shift: half, A_max: 1, trigger: eig}
  - {label: bridge_half_eig_A2, mechanism: bridge, shift: half, A_max: 2, trigger: eig}
  - {label: bridge_s1_eig_A1, mechanism: bridge, shift: "1", A_max: 1, trigger: eig}
  - {label: bridge_s1_eig_A2, mechanism: bridge, shift: "1", A_max: 2, trigger: eig}
