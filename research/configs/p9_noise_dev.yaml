experiment_id: p9_noise_dev
status: PRELIMINARY / DEV
description: >
  Phase 9 dev run (D-030). Analytic Dirichlet-level noise channels (not the published
  paper's noise models, which could not be checked). Fixed-budget decoding (faithful AWQPE
  eps 0.9 / eps_safe, D2 ideal-likelihood, D2 noise-aware) and P8 credible stopping with the
  ideal vs noise-aware posterior. Nothing is tuned.
master_seed: 20260929
split: dev
strata: [S0_dyadic, S1_final_half, S2_boundary, S3_near_grid, S4_uniform]
partitions: [[4, 4], [4, 4, 4], [4, 4, 4, 4]]
phases_per_stratum: 6
replicates: 4
phase_chunk: 10
fixed_S: [16, 64, 256]
S0: 4
cap_per_block: 256
alpha: 0.05
stop_tau_exponents: [half, n]
likelihood_refine: {"8": 3, "12": 3, "16": 2}
noise_settings:
  - {id: ideal, channel: none, spec: {}}
  - {id: ro01, channel: readout, spec: {readout_p01: 0.01, readout_p10: 0.01}}
  - {id: ro03, channel: readout, spec: {readout_p01: 0.03, readout_p10: 0.03}}
  - {id: ro05, channel: readout, spec: {readout_p01: 0.05, readout_p10: 0.05}}
  - {id: dp6, channel: depolarising, spec: {depol_gamma: 1.0e-6}}
  - {id: dp5, channel: depolarising, spec: {depol_gamma: 1.0e-5}}
  - {id: dp4, channel: depolarising, spec: {depol_gamma: 1.0e-4}}
  - {id: jt01, channel: jitter, spec: {jitter_sigma: 0.01}}
  - {id: jt02, channel: jitter, spec: {jitter_sigma: 0.02}}
  - {id: jt04, channel: jitter, spec: {jitter_sigma: 0.04}}
  - {id: comb, channel: combined, spec: {readout_p01: 0.02, readout_p10: 0.02, depol_gamma: 1.0e-5, jitter_sigma: 0.02}}
pilot_overrides:
  partitions: [[4, 4], [4, 4, 4, 4]]
  phases_per_stratum: 1
  replicates: 2
